[project]
name = "training-governanca"
version = "0.1.0"
description = "Validador da governança do Training System (governanca/pipeline.md)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6,<7",
]

[project.scripts]
validar-governanca = "training_governanca.validador:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
