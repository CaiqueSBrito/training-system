[project]
name = "training-ingestion"
version = "0.1.0"
description = "Recepção, parsing local com Docling e chunking estrutural."
requires-python = ">=3.13,<3.14"
dependencies = [
    "training-contracts",
    "training-lineage",
    "docling>=2.150.1,<3",
    "qdrant-client>=1.20.0",
    "training-llm",
]

[tool.uv.sources]
training-contracts = { workspace = true }
training-lineage = { workspace = true }
training-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
