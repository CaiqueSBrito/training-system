[project]
name = "training-contracts"
version = "0.1.0"
description = "Contratos entre pacotes: modelos Pydantic da pipeline de chat e da ingestão (publicados pelo OpenAPI da apps/api, ADR-0014)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14,<3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
